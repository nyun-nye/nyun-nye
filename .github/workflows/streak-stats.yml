
name: Update Pastel Streak Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pastel Streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=nyun-nye&background=FFF8FC&ring=FFB7D5&fire=FF91B9&currStreakLabel=E7A2CF&sideLabels=B29AD6&dates=B3A7BD&stroke=F5D3EA&border=F5D3EA&border_radius=15
          path: profile/streak.svg

      - name: Commit Streak Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --cached --quiet || git commit -m "Update streak stats"
          git push
