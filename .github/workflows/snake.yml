
name: Generate Pastel Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pink Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nyun-nye
          outputs: |
            dist/github-snake.svg?color_snake=%23FF8FC7&color_dots=%23FFF5FA,%23FAD7E8,%23EDBCE1,%23D7B8F5,%23B7DAF7

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
